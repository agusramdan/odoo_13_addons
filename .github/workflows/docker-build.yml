name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Sesuaikan jika branch utama Anda bernama 'master'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx (mendukung build multi-arsitektur dan cache yang lebih baik)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get current date
        id: date
        run: echo "DATE_TAG=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # 4. Build dan push image ke Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/odoo-13-addons:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/odoo-13-addons:${{ env.DATE_TAG }}
