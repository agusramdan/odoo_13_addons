services:
  db:
    image: postgres:12
    container_name: odoo13_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    container_name: odoo13_app
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069" # Odoo HTTP
      - "5678:5678" # Remote debugging (debugpy)
    volumes:
      - ./workspace:/workspace
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_filestore:/var/lib/odoo
    working_dir: /workspace
    # Gunakan sleep infinity agar kontainer tetap hidup saat Anda start/stop Odoo atau debugpy secara manual
    entrypoint: []
    command: ["sleep", "infinity"]
    networks:
      - dev_net

  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    container_name: hermes_agent
    restart: unless-stopped
    user: "1000:1000"
    # Sesuaikan GID grup docker di host VPS (cek via: getent group docker | cut -d: -f3)
    # group_add:
    #   - "999"
    depends_on:
      - odoo
    env_file:
      - path: /opt/devpod-infra/dev.env
        required: false
    environment:
      - ODOO_CONTAINER=odoo13_app
      - ODOO_URL=http://odoo:8069
      - PGHOST=db
      - PGUSER=odoo
      - PGPASSWORD=odoo
    volumes:
      - ./workspace:/workspace
      - hermes_memory:/home/dev/.hermes
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command: ["sleep", "infinity"]
    networks:
      - dev_net

volumes:
  pgdata:
  odoo_filestore:
  hermes_memory:

networks:
  caddy_net:
    external: true
  ai_net:
    external: true
  dev_net:
    driver: bridge
